<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>7/26 GO Fest 終極戰術面板 (戶外實戰版)</title>
    <style>
        :root {
            --mystic-blue: #0055FF;
            --valor-red: #FF3333;
            --instinct-yellow: #FFCC00;
            
            --bg-dark: #121212;
            --bg-card: #222;
            --bg-modal: #1A1A1A;
            --text-main: #FFF;
            --safe-bottom: 20px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; height: 100vh;
            overflow: hidden;
        }

        /* 頂部列：動態背景色與陰影 */
        header {
            position: fixed; top: 0; width: 100%;
            background: rgba(18, 18, 18, 0.92); backdrop-filter: blur(10px);
            z-index: 100; padding: 12px 15px;
            border-bottom: 3px solid #444;
            display: flex; align-items: center; justify-content: center; gap: 12px;
            transition: background-color 0.5s, border-color 0.5s;
        }
        .time-label { font-size: 13px; color: #CCC; font-weight: bold; }
        .clock { font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums; color: #FFF; }

        /* 主內容區 */
        main { 
            flex: 1; padding: 75px 12px 120px 12px; 
            overflow-y: auto; 
        }

        .section-title {
            font-size: 18px; font-weight: 900; margin: 24px 0 12px;
            padding-left: 10px; border-left: 5px solid #FFF;
        }

        /* 卡片網格 */
        .boss-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .boss-grid.others { grid-template-columns: 1fr 1fr; gap: 10px; }

        .boss-card {
            background-color: var(--bg-card); border-radius: 12px;
            padding: 16px; border: 1px solid #333;
            cursor: pointer; position: relative; overflow: hidden;
        }
        
        .boss-card.highlight::before {
            content: '⭐ 絕對必打 / Must Do';
            position: absolute; top: 0; left: 0; width: 100%;
            font-size: 11px; font-weight: bold; text-align: center;
            padding: 4px 0; background: rgba(255,255,255,0.15);
        }
        .boss-card.highlight { padding-top: 30px; border-width: 2px; }

        .boss-name { font-size: 20px; font-weight: 900; line-height: 1.2; }
        .boss-en { font-size: 12px; color: #999; margin-bottom: 8px; }
        .boss-card.others .boss-name { font-size: 16px; }

        /* 屬性標籤 */
        .type-pill {
            display: inline-block; padding: 4px 10px; border-radius: 6px;
            font-size: 13px; font-weight: 900; margin-right: 6px; color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
        }
        .type-psychic { background-color: #F85888; }
        .type-dragon { background-color: #7038F8; }
        .type-steel { background-color: #B8B8D0; }
        .type-water { background-color: #6890F0; }
        .type-electric { background-color: #F8D030; }
        .type-fighting { background-color: #C03028; }
        .type-dark { background-color: #705848; }
        .type-rock { background-color: #B8A038; }
        .type-bug { background-color: #A8B820; }
        .type-ghost { background-color: #705898; }
        .type-ground { background-color: #E0C068; }
        .type-fire { background-color: #F08030; }
        .type-ice { background-color: #98D8D8; }
        .type-poison { background-color: #A040A0; }
        .type-fairy { background-color: #EE99AC; }

        /* 彈出視窗 (Modal) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: flex-end;
            z-index: 200;
        }
        .modal-overlay.active { display: flex; }
        
        .modal-content {
            background: var(--bg-modal); width: 100%; max-height: 90vh;
            border-radius: 20px 20px 0 0; padding: 20px 20px 0 20px;
            display: flex; flex-direction: column;
            animation: slideUp 0.25s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .modal-header { border-bottom: 1px solid #333; padding-bottom: 12px; margin-bottom: 15px; position: relative; flex-shrink: 0; }
        .m-title { font-size: 24px; font-weight: 900; }
        .m-en { font-size: 14px; color: #999; margin-top: 2px; }
        .close-btn {
            position: absolute; right: 0; top: 0;
            background: #444; color: white; border: none;
            width: 36px; height: 36px; border-radius: 18px; font-size: 18px; font-weight: bold;
        }

        .modal-scroll-area {
            overflow-y: auto;
            flex: 1;
            padding-bottom: 30px;
        }

        .attr-container {
            display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px;
        }
        .attr-box { padding: 12px; border-radius: 8px; }
        .attr-box.type { background: rgba(255,255,255,0.08); border-left: 5px solid #888; }
        .attr-box.weak { background: rgba(255, 51, 51, 0.15); border-left: 5px solid #FF3333; }
        .attr-title { font-size: 13px; font-weight: 900; margin-bottom: 8px; }
        .attr-title.type { color: #DDD; }
        .attr-title.weak { color: #FF5555; }

        .split-view {
            display: flex; gap: 10px; 
            min-height: min-content;
        }
        .col { flex: 1; border-radius: 8px; padding: 10px; height: max-content; }
        .col-good { background: rgba(0, 200, 83, 0.1); border-top: 4px solid #00C853; }
        .col-bad { background: rgba(229, 57, 53, 0.1); border-top: 4px solid #E53935; }
        
        .col-title { font-size: 15px; font-weight: 900; text-align: center; margin-bottom: 12px; }
        .col-good .col-title { color: #00C853; }
        .col-bad .col-title { color: #E53935; }

        .poke-item {
            background: rgba(0,0,0,0.4); border-radius: 6px;
            padding: 10px 8px; margin-bottom: 8px; text-align: center;
        }
        .poke-item:last-child { margin-bottom: 0; }
        .poke-tw { font-size: 14px; font-weight: 900; margin-bottom: 2px; }
        .poke-en { font-size: 11px; color: #AAA; }
        
        /* 底部導覽列 */
        nav {
            position: fixed; bottom: 0; width: 100%;
            background: #111; display: flex;
            padding-bottom: var(--safe-bottom); border-top: 1px solid #333; z-index: 100;
        }
        .nav-item {
            flex: 1; text-align: center; padding: 15px 0;
            color: #555; font-size: 15px; font-weight: 900;
            transition: all 0.2s; border-top: 4px solid transparent;
        }
        .nav-time { font-size: 18px; font-weight: 900; display: block; margin-bottom: 4px; }

        .nav-item.active-mystic { color: var(--mystic-blue); border-color: var(--mystic-blue); background: rgba(0,85,255,0.15); }
        .nav-item.active-valor { color: var(--valor-red); border-color: var(--valor-red); background: rgba(255,51,51,0.15); }
        .nav-item.active-instinct { color: var(--instinct-yellow); border-color: var(--instinct-yellow); background: rgba(255,204,0,0.15); }
        
    </style>
</head>

        function updateClock() {
            const now = new Date();
            const h = now.getHours();
            const m = now.getMinutes();
            const s = now.getSeconds();
            
            document.getElementById('clock').textContent = 
                String(h).padStart(2, '0') + ':' + 
                String(m).padStart(2, '0') + ':' + 
                String(s).padStart(2, '0');

            // 判斷是否為週日活動日 (假設 7/26 日期，若平時測試可拔除日期限制，此處僅做簡易時段判斷)
            // 這裡直接依據當前時間點自動變換頂部列底色
            const header = document.getElementById('top-header');
            
            // 模擬：如果剛好在活動時間範圍內 (假設 10:00 ~ 19:00)
            if (h >= 10 && h < 13) {
                header.style.backgroundColor = 'rgba(0, 85, 255, 0.35)'; // 藍色基調
                header.style.borderColor = 'var(--mystic-blue)';
            } else if (h >= 13 && h < 16) {
                header.style.backgroundColor = 'rgba(255, 51, 51, 0.35)'; // 紅色基調
                header.style.borderColor = 'var(--valor-red)';
            } else if (h >= 16 && h < 19) {
                header.style.backgroundColor = 'rgba(255, 204, 0, 0.35)'; // 黃色基調
                header.style.borderColor = 'var(--instinct-yellow)';
            } else {
                header.style.backgroundColor = 'rgba(18, 18, 18, 0.92)'; // 非活動時間為沉穩黑色
                header.style.borderColor = '#444';
            }
        }

        // 3. 渲染主頁面
        function render(pId) {
            const d = phases[pId];
            
            let html = `<div class="section-title">⭐ 核心必打目標</div><div class="boss-grid">`;
            d.hl.forEach(b => {
                const info = db[b];
                html += `<div class="boss-card highlight" onclick="openM('${b}')">
                    <div class="boss-name">${b}</div><div class="boss-en">${info.en}</div>
                    <div>${info.types.map(t=>`<span class="type-pill ${t.c}">${t.n}</span>`).join('')}</div>
                </div>`;
            });
            html += `</div><div class="section-title" style="border-left-color:#666">⚔️ 其他陣容</div><div class="boss-grid others">`;
            d.ot.forEach(b => {
                const info = db[b];
                html += `<div class="boss-card others" onclick="openM('${b}')">
                    <div class="boss-name">${b}</div><div class="boss-en">${info.en}</div>
                    <div>${info.types.map(t=>`<span class="type-pill ${t.c}">${t.n}</span>`).join('')}</div>
                </div>`;
            });
            document.getElementById('content').innerHTML = html + `</div>`;
        }

        // 4. 切換與彈窗邏輯
        function switchTab(pId) {
            document.querySelectorAll('.nav-item').forEach(el => el.className = 'nav-item');
            const classMap = { 'p1': 'active-mystic', 'p2': 'active-valor', 'p3': 'active-instinct' };
            document.getElementById('tab-' + pId).classList.add(classMap[pId]);
            render(pId); document.getElementById('content').scrollTo(0, 0);
        }

        function openM(name) {
            const info = db[name];
            document.getElementById('m-title').textContent = name;
            document.getElementById('m-en').textContent = info.en;
            
            document.getElementById('m-types').innerHTML = info.types.map(t=>`<span class="type-pill ${t.c}">${t.n}</span>`).join('');
            document.getElementById('m-weaks').innerHTML = info.weaks.map(w=>`<span class="type-pill ${w.c}">${w.n}</span>`).join('');

            document.getElementById('m-good-list').innerHTML = info.good.map(g=>
                `<div class="poke-item"><div class="poke-tw">${g.t}</div><div class="poke-en">${g.e}</div></div>`
            ).join('');
            document.getElementById('m-bad-list').innerHTML = info.bad.map(b=>
                `<div class="poke-item"><div class="poke-tw">${b.t}</div><div class="poke-en">${b.e}</div></div>`
            ).join('');

            document.getElementById('modal').classList.add('active');
            document.querySelector('.modal-scroll-area').scrollTop = 0;
        }

        function closeModal(e) {
            if (e === true || e.target.id === 'modal') {
                document.getElementById('modal').classList.remove('active');
            }
        }
